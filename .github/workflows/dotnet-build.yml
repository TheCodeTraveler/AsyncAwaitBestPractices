# Ported from azure-pipelines.yml.
# Every action is pinned to the full commit SHA of the release named in its trailing comment.
# The github-actions ecosystem in .github/dependabot.yml keeps those SHAs and comments up to date.
name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Publishing a GitHub Release builds production NuGet packages versioned from the release tag
  # and attaches them to the release. Publishing a release also pushes its tag, so this workflow
  # does not also trigger on tag pushes; that would build every release twice.
  release:
    types:
      - published

permissions:
  contents: read

# Azure Pipelines `pr: autoCancel: true`: a new push to a pull request cancels that pull request's in-progress run.
# Pushes to main and tags fall back to the unique run_id, so every CI run completes, as it did in Azure Pipelines.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CurrentSemanticVersionBase: '99.0.0'
  # Replaces $[counter(variables['CurrentSemanticVersionBase'], 1001)].
  # Azure Pipelines' last preview package was 99.0.0-preview1416, so GitHub runs continue at 1417.
  # Keeping the number at four digits keeps SemVer's lexical ordering of `previewNNNN` correct.
  PreviewNumberOffset: 1416
  NET_VERSION: '10.0.x'
  PathToSolution: 'AsyncAwaitBestPractices.slnx'
  PathToSampleAppCsproj: 'sample/HackerNews.csproj'
  PathToUnitTestsCsproj: 'src/AsyncAwaitBestPractices.UnitTests/AsyncAwaitBestPractices.UnitTests.csproj'
  PathToAsyncAwaitBestPracticesCsproj: 'src/AsyncAwaitBestPractices/AsyncAwaitBestPractices.csproj'
  PathToAsyncAwaitBestPracticesMVVMCsproj: 'src/AsyncAwaitBestPractices.MVVM/AsyncAwaitBestPractices.MVVM.csproj'
  Xcode_Version: '27.0'

jobs:
  build_sample:
    name: Build .NET MAUI Sample App (${{ matrix.name }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            image: windows-latest
          - name: macOS
            image: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Xcode v${{ env.Xcode_Version }}
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.Xcode_Version }}

      - name: Download iOS Platform
        if: runner.os == 'macOS'
        run: |
          xcodebuild -downloadPlatform iOS

          echo "Installed Simulator SDKs:"
          xcodebuild -showsdks

      - name: Use .NET SDK v${{ env.NET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.NET_VERSION }}
          dotnet-quality: 'ga'

      - name: Install .NET MAUI Workload
        shell: bash
        run: |
          dotnet workload install maui
          dotnet workload update

      - name: Build Sample App
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # HackerNews.csproj builds iOS for a device (ios-arm64), which requires code signing by default.
            # This workflow has no Apple certificate or provisioning profile, so the macOS build skips code signing.
            dotnet build "$PathToSampleAppCsproj" -p:EnableCodeSigning=false
          else
            dotnet build "$PathToSampleAppCsproj"
          fi

  build_test_library:
    name: Build + Test Library
    runs-on: windows-latest
    timeout-minutes: 60
    # Release runs sign the library DLLs with Azure Artifact Signing. Azure only trusts GitHub's OIDC token
    # from the `release` environment, so pull requests and pushes to main build and pack unsigned DLLs.
    environment: ${{ github.event_name == 'release' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set NuGet Version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            # Release tags are the package version, optionally prefixed with `v` (e.g. `v10.1.0` or `10.1.0-pre1`).
            $nugetPackageVersion = $env:RELEASE_TAG -replace '^v', ''
            if ($nugetPackageVersion -notmatch '^(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') {
              throw "Release tag '$($env:RELEASE_TAG)' is not a valid NuGet version. Use a tag such as v10.1.0 or v10.1.0-pre1."
            }

            # AssemblyVersion and AssemblyFileVersion come from the NuGetVersion MSBuild property, which must not contain a prerelease suffix.
            "ReleaseNuGetVersion=$($Matches[1])" >> $env:GITHUB_ENV
            Write-Host "GitHub Release Tag = $($env:RELEASE_TAG)"
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $commitId = $env:PR_HEAD_SHA.Substring(0, 7)
            $nugetPackageVersion = "$($env:CurrentSemanticVersionBase)-build-$($env:PR_NUMBER).$($env:GITHUB_RUN_NUMBER)+$commitId"
            Write-Host "GitHub PR = $($env:PR_NUMBER), Commit = $commitId"
          }
          else {
            $previewNumber = [int]$env:PreviewNumberOffset + [int]$env:GITHUB_RUN_NUMBER
            $nugetPackageVersion = "$($env:CurrentSemanticVersionBase)-preview$previewNumber"
          }

          Write-Host "NuGet Package Version = $nugetPackageVersion"
          "NugetPackageVersion=$nugetPackageVersion" >> $env:GITHUB_ENV
          "NuGet Package Version: ``$nugetPackageVersion``" >> $env:GITHUB_STEP_SUMMARY

      - name: Use .NET SDKs 8.0.x, 9.0.x, ${{ env.NET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            ${{ env.NET_VERSION }}
          dotnet-quality: 'ga'

      - name: Run UnitTests
        run: dotnet test $env:PathToUnitTestsCsproj -c Release --settings ".runsettings" --collect "code coverage" --logger trx --results-directory "$env:RUNNER_TEMP"

      - name: Publish Test Results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Unit Tests
          path: ${{ runner.temp }}/*.trx
          path-replace-backslashes: 'true'
          reporter: dotnet-trx
          use-actions-summary: 'true'
          fail-on-error: 'false'
          fail-on-empty: 'false'

      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/*.trx

      - name: Generate Code Coverage Report
        id: code-coverage
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: ${{ runner.temp }}/**/coverage.cobertura.xml
          targetdir: ${{ runner.temp }}/CodeCoverage
          reporttypes: HtmlInline;MarkdownSummaryGithub
          toolpath: ${{ runner.temp }}/reportgeneratortool

      - name: Publish Code Coverage Summary
        if: ${{ !cancelled() && steps.code-coverage.outcome == 'success' }}
        run: Get-Content -Path "$env:RUNNER_TEMP/CodeCoverage/SummaryGithub.md" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload Code Coverage Report
        if: ${{ !cancelled() && steps.code-coverage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage-report
          path: ${{ runner.temp }}/CodeCoverage

      # Building, signing, and packing are separate steps so the DLLs are signed after they are built and
      # `dotnet pack --no-build` packages those signed DLLs instead of rebuilding them.
      - name: Build AsyncAwaitBestPractices + AsyncAwaitBestPractices.MVVM
        run: |
          $buildArguments = @('-c', 'Release', "-p:PackageVersion=$env:NugetPackageVersion")
          if ($env:ReleaseNuGetVersion) {
            $buildArguments += "-p:NuGetVersion=$env:ReleaseNuGetVersion"
          }

          dotnet build $env:PathToAsyncAwaitBestPracticesCsproj @buildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $env:PathToAsyncAwaitBestPracticesMVVMCsproj @buildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Azure Artifact Signing Configuration
        if: ${{ github.event_name == 'release' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $missing = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT_NAME', 'ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Add these secrets/variables to the 'release' environment (Settings > Environments > release): $($missing -join ', ')"
          }

      - name: Find Library DLLs to Sign
        id: files-to-sign
        if: ${{ github.event_name == 'release' }}
        run: |
          $files = @(
            Get-ChildItem -Path 'src/AsyncAwaitBestPractices/bin/Release/*/AsyncAwaitBestPractices.dll'
            Get-ChildItem -Path 'src/AsyncAwaitBestPractices.MVVM/bin/Release/*/AsyncAwaitBestPractices.MVVM.dll'
          )
          if ($files.Count -eq 0) {
            throw "No library DLLs were found to sign."
          }

          $files.FullName | ForEach-Object { Write-Host $_ }
          "files<<EOF" >> $env:GITHUB_OUTPUT
          $files.FullName >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Sign In to Azure
        if: ${{ github.event_name == 'release' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Library DLLs with Azure Artifact Signing
        if: ${{ github.event_name == 'release' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.files-to-sign.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pack AsyncAwaitBestPractices + AsyncAwaitBestPractices.MVVM NuGets
        run: |
          $packArguments = @('-c', 'Release', '--no-build', "-p:PackageVersion=$env:NugetPackageVersion")
          if ($env:ReleaseNuGetVersion) {
            $packArguments += "-p:NuGetVersion=$env:ReleaseNuGetVersion"
          }

          dotnet pack $env:PathToAsyncAwaitBestPracticesCsproj @packArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack $env:PathToAsyncAwaitBestPracticesMVVMCsproj @packArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Authenticode Signatures in NuGet Packages
        if: ${{ github.event_name == 'release' }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem -Path ./src -Recurse -Filter *.nupkg | Where-Object { $_.FullName -match '[\\/]bin[\\/]Release[\\/]' })
          if ($packages.Count -eq 0) {
            throw "No NuGet packages were produced."
          }

          foreach ($package in $packages) {
            $extractPath = Join-Path $env:RUNNER_TEMP ([System.IO.Path]::GetRandomFileName())
            [System.IO.Compression.ZipFile]::ExtractToDirectory($package.FullName, $extractPath)
            $assemblies = @(Get-ChildItem -Path (Join-Path $extractPath 'lib') -Recurse -Filter *.dll -ErrorAction SilentlyContinue)
            if ($assemblies.Count -eq 0) {
              throw "No library DLLs were found in $($package.Name)."
            }

            foreach ($assembly in $assemblies) {
              $signature = Get-AuthenticodeSignature -FilePath $assembly.FullName
              Write-Host "$($package.Name) $($assembly.FullName.Substring($extractPath.Length)): $($signature.Status) ($($signature.SignerCertificate.Subject))"
              if ($signature.Status -ne 'Valid') {
                throw "Authenticode signature verification failed for $($assembly.FullName): $($signature.StatusMessage)"
              }
              if ($null -eq $signature.TimeStamperCertificate) {
                throw "The Authenticode signature for $($assembly.FullName) is not timestamped."
              }
            }

            Remove-Item -Path $extractPath -Recurse -Force
          }

      - name: Check AsyncAwaitBestPractices Dependencies Vulnerabilities
        if: ${{ !cancelled() }}
        run: |
          dotnet list $env:PathToAsyncAwaitBestPracticesCsproj package --vulnerable --include-transitive | Tee-Object -Variable output
          if ($output -cmatch 'has the following vulnerable packages') { exit 1 }
          exit 0

      - name: Check AsyncAwaitBestPractices.MVVM Dependencies Vulnerabilities
        if: ${{ !cancelled() }}
        run: |
          dotnet list $env:PathToAsyncAwaitBestPracticesMVVMCsproj package --vulnerable --include-transitive | Tee-Object -Variable output
          if ($output -cmatch 'has the following vulnerable packages') { exit 1 }
          exit 0

      - name: Check Sample App Dependencies Vulnerabilities
        if: ${{ !cancelled() }}
        run: |
          dotnet list $env:PathToSampleAppCsproj package --vulnerable --include-transitive | Tee-Object -Variable output
          if ($output -cmatch 'has the following vulnerable packages') { exit 1 }
          exit 0

      - name: Copy NuGet Packages to Staging Directory
        run: |
          $stagingDirectory = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'nuget')
          Get-ChildItem -Path ./src -Recurse | Where-Object { $_.Extension -match 'nupkg' } | Copy-Item -Destination $stagingDirectory.FullName

      - name: Publish NuGet Packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: ${{ runner.temp }}/nuget
          if-no-files-found: error

  attach_release_assets:
    name: Attach NuGet Packages to GitHub Release
    if: ${{ github.event_name == 'release' }}
    needs:
      - build_sample
      - build_test_library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write to the repository, and it runs no build tools or third-party actions besides artifact download.
    permissions:
      contents: write

    steps:
      - name: Download NuGet Packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: ${{ runner.temp }}/nuget

      - name: Upload NuGet Packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/nuget/*.nupkg "$RUNNER_TEMP"/nuget/*.snupkg --repo "$GITHUB_REPOSITORY" --clobber
