# Ported from azure-pipelines.yml.
# Every action is pinned to the full commit SHA of the release named in its trailing comment.
# The github-actions ecosystem in .github/dependabot.yml keeps those SHAs and comments up to date.
name: Build

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Azure Pipelines `pr: autoCancel: true`: a new push to a pull request cancels that pull request's in-progress run.
# Pushes to main and tags fall back to the unique run_id, so every CI run completes, as it did in Azure Pipelines.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CurrentSemanticVersionBase: '99.0.0'
  # Replaces $[counter(variables['CurrentSemanticVersionBase'], 1001)].
  # Azure Pipelines' last preview package was 99.0.0-preview1416, so GitHub runs continue at 1417.
  # Keeping the number at four digits keeps SemVer's lexical ordering of `previewNNNN` correct.
  PreviewNumberOffset: 1416
  # global.json pins the .NET 11 SDK, which builds everything; the unit tests also need the .NET 8, 9 and 10 runtimes
  NET_VERSION: '11.0.x'
  # .NET 11 is a release candidate until GA, and after GA the 'preview' feed stays on the last RC (as the 8.0, 9.0 and 10.0 feeds do), so switch to 'ga' together with global.json
  NET_QUALITY: 'preview'
  PathToSolution: 'AsyncAwaitBestPractices.slnx'
  PathToSampleAppCsproj: 'sample/HackerNews.csproj'
  PathToUnitTestsCsproj: 'src/AsyncAwaitBestPractices.UnitTests/AsyncAwaitBestPractices.UnitTests.csproj'
  PathToAsyncAwaitBestPracticesCsproj: 'src/AsyncAwaitBestPractices/AsyncAwaitBestPractices.csproj'
  PathToAsyncAwaitBestPracticesMVVMCsproj: 'src/AsyncAwaitBestPractices.MVVM/AsyncAwaitBestPractices.MVVM.csproj'

jobs:
  build_sample:
    name: Build Blazor Sample App (${{ matrix.name }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            image: windows-latest
          - name: macOS
            image: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use .NET SDK v${{ env.NET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.NET_VERSION }}
          dotnet-quality: ${{ env.NET_QUALITY }}

      - name: Build Sample App
        shell: bash
        run: dotnet build "$PathToSampleAppCsproj"

      # bash on GitHub runners runs with pipefail, so a failing `dotnet list` fails the step
      - name: Check Sample App Dependencies Vulnerabilities
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          dotnet list "$PathToSampleAppCsproj" package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable-packages.txt"
          if grep -q 'has the following vulnerable packages' "$RUNNER_TEMP/vulnerable-packages.txt"; then exit 1; fi

  build_test_library:
    name: Build + Test Library
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set NuGet Version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $commitId = $env:PR_HEAD_SHA.Substring(0, 7)
            $nugetPackageVersion = "$($env:CurrentSemanticVersionBase)-build-$($env:PR_NUMBER).$($env:GITHUB_RUN_NUMBER)+$commitId"
            Write-Host "GitHub PR = $($env:PR_NUMBER), Commit = $commitId"
          }
          else {
            $previewNumber = [int]$env:PreviewNumberOffset + [int]$env:GITHUB_RUN_NUMBER
            $nugetPackageVersion = "$($env:CurrentSemanticVersionBase)-preview$previewNumber"
          }

          Write-Host "NuGet Package Version = $nugetPackageVersion"
          "NugetPackageVersion=$nugetPackageVersion" >> $env:GITHUB_ENV
          "NuGet Package Version: ``$nugetPackageVersion``" >> $env:GITHUB_STEP_SUMMARY

      # The unit tests run on these three runtimes; each SDK brings its runtime
      - name: Use .NET SDKs 8.0.x, 9.0.x, 10.0.x
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          dotnet-quality: 'ga'

      - name: Use .NET SDK v${{ env.NET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.NET_VERSION }}
          dotnet-quality: ${{ env.NET_QUALITY }}

      - name: Run UnitTests
        run: dotnet test $env:PathToUnitTestsCsproj -c Release --settings ".runsettings" --collect "code coverage" --logger trx --results-directory "$env:RUNNER_TEMP"

      - name: Publish Test Results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Unit Tests
          path: ${{ runner.temp }}/*.trx
          path-replace-backslashes: 'true'
          reporter: dotnet-trx
          use-actions-summary: 'true'
          fail-on-error: 'false'
          fail-on-empty: 'false'

      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/*.trx

      - name: Generate Code Coverage Report
        id: code-coverage
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: ${{ runner.temp }}/**/coverage.cobertura.xml
          targetdir: ${{ runner.temp }}/CodeCoverage
          reporttypes: HtmlInline;MarkdownSummaryGithub
          toolpath: ${{ runner.temp }}/reportgeneratortool

      - name: Publish Code Coverage Summary
        if: ${{ !cancelled() && steps.code-coverage.outcome == 'success' }}
        run: Get-Content -Path "$env:RUNNER_TEMP/CodeCoverage/SummaryGithub.md" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload Code Coverage Report
        if: ${{ !cancelled() && steps.code-coverage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage-report
          path: ${{ runner.temp }}/CodeCoverage

      - name: Pack AsyncAwaitBestPractices NuGet
        run: dotnet pack $env:PathToAsyncAwaitBestPracticesCsproj -c Release "-p:PackageVersion=$env:NugetPackageVersion"

      - name: Pack AsyncAwaitBestPractices.MVVM NuGet
        run: dotnet pack $env:PathToAsyncAwaitBestPracticesMVVMCsproj -c Release "-p:PackageVersion=$env:NugetPackageVersion"

      - name: Check AsyncAwaitBestPractices Dependencies Vulnerabilities
        if: ${{ !cancelled() }}
        run: |
          dotnet list $env:PathToAsyncAwaitBestPracticesCsproj package --vulnerable --include-transitive | Tee-Object -Variable output
          if ($output -cmatch 'has the following vulnerable packages') { exit 1 }
          exit 0

      - name: Check AsyncAwaitBestPractices.MVVM Dependencies Vulnerabilities
        if: ${{ !cancelled() }}
        run: |
          dotnet list $env:PathToAsyncAwaitBestPracticesMVVMCsproj package --vulnerable --include-transitive | Tee-Object -Variable output
          if ($output -cmatch 'has the following vulnerable packages') { exit 1 }
          exit 0

      - name: Copy NuGet Packages to Staging Directory
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          $stagingDirectory = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'nuget')
          Get-ChildItem -Path ./src -Recurse | Where-Object { $_.Extension -match 'nupkg' } | Copy-Item -Destination $stagingDirectory.FullName

      - name: Publish NuGet Packages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: ${{ runner.temp }}/nuget
          if-no-files-found: error
